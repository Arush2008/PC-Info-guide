<!DOCTYPE html>
<html>

<head>
    <title>All Case Fans</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="components_page">

<nav class="top_nav_bar">
    <h1 class="logo">PCforce</h1>
    <a href="/">Home</a>
    <a href="/learn">Learn</a>
    <a href="/components">Components</a>
</nav>

<h1 class="page_title">All Case Fans</h1>

<form method="get" action="">
    <input
        type="text"
        name="q"
        placeholder="Search by model or brand"
        value="{{ q }}"
    >
    <button type="submit">Search</button>
</form>

<section class="component_section">

    <div class="component_grid">

        {% for case_fan in case_fans %}

        <button class="component_card">
            <div class="image">
            </div>

            <div class="card_info">
                <p>{{ case_fan.brand.name }}</p>
                <h2>{{ case_fan.model }}</h2>
                <p>${{ case_fan.price }}</p>
            </div>
        </button>

        {% endfor %}

    </div>

        </section>

        <script>
            const componentCards = document.querySelectorAll('.component_card');

            componentCards.forEach(card => {
                card.addEventListener('click', () => {

                    const model = card.querySelector('h2').textContent;
                    const brand = card.querySelector('p').textContent;
                    const price = card.querySelectorAll('p')[1].textContent;

                    const modal = document.createElement('div');
                    modal.classList.add('modal');

                    modal.innerHTML = `
                        <div class="modal-content">
                            <span class="close-button">&times;</span>
                            <h2>${model}</h2>
                            <p>Brand: ${brand}</p>
                            <p>Price: ${price}</p>
                        </div>
                    `;

                    document.body.appendChild(modal);

                    modal.style.display = 'block';

                    modal.querySelector('.close-button').addEventListener('click', () => {
                        modal.style.display = 'none';
                        document.body.removeChild(modal);
                    });

                    window.addEventListener('click', (event) => {
                        if (event.target === modal) {
                            modal.style.display = 'none';
                            document.body.removeChild(modal);
                        }
                    });
                });
            });
        </script>

</body>
</html>
