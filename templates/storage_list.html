<!DOCTYPE html>
<html>

<head>
    <title>All GPUs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="components_page">

<nav class="top_nav_bar">
    <h1 class="logo">PCforce</h1>
    <a href="/">Home</a>
    <a href="/learn">Learn</a>
    <a href="/components">Components</a>
</nav>

<h1 class="page_title">All Storage Devices</h1>

<form method="get" action="">
    <input
        type="text"
        name="q"
        placeholder="Search by model or brand"
        value="{{ q }}"
    >
    <button type="submit">Search</button>
</form>

<section class="component_section">

    <div class="component_grid">

        {% for storage_item in storage %}

        <div class="component_card">

            <div class="image">
                <img src="{{ url_for('static', filename=storage_item.image) }}" alt="{{ storage_item.model }}">
            </div>

            <div class="card_info">

                <p>{{ storage_item.brand.name }}</p>

                <h2>{{ storage_item.model }}</h2>

                <p>Capacity: {{ storage_item.capacity }} GB</p>

                <p>${{ storage_item.price }}</p>
            </div>

        </div>

        {% endfor %}

    </div>

</section>

</body>
</html>
