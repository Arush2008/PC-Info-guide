<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    <body>
        <nav class="top_nav_bar">
            <h1 class="logo">PCforce</h1>
                <a href="/">Home</a>
                <a href="/learn">Learn</a>
                <a href="/components">components</a>
        </nav>
<body class="components_page">
    <h1>GPU List</h1>

    {% for gpu in gpus %}
        <div class="component_card">
            <div class="image">Image</div>
            <p>{{ gpu.brand.name }}</p>
            <h2>{{ gpu.model }}</h2>
            <p>VRAM: {{ gpu.vram }} GB</p>
            <p>${{ gpu.price }}</p>
        </div>
    {% endfor %}

    <h1>CPU List</h1>

    {% for cpu in cpus %}
        <div class="component_card">
            <div class="image">Image</div>
            <p>{{ cpu.brand.name }}</p>
            <h2>{{ cpu.model }}</h2>
            <p>Cores: {{ cpu.cores }}</p>
            <p>${{ cpu.price }}</p>
        </div>
    {% endfor %}
</body>
</html>
