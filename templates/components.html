<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

    <body>
        <nav class="top_nav_bar">
            <h1 class="logo">PCforce</h1>
                <a href="/">Home</a>
                <a href="/learn">Learn</a>
                <a href="/components">components</a>
                <a href="/add-gpu">Add GPU</a>
        </nav>
<body>
    <h1>GPU List</h1>

    {% for gpu in gpus %}
        <div>
            <h2>{{ gpu.model }}</h2>
            <p>Brand: {{ gpu.brand.name }}</p>
            <p>VRAM: {{ gpu.vram }} GB</p>
            <p>Price: ${{ gpu.price }}</p>
            <p>Power Consumption: {{ gpu.power_usage }} W</p>
        </div>
    {% endfor %}
</body>
</html>
