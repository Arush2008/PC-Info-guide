<!DOCTYPE html>
<html>
<head>
    <title>PC Guide</title>
</head>
<body>
    <h1>GPU List</h1>

    {% for gpu in gpus %}
        <div>
            <h2>{{ gpu.model }}</h2>
            <p>Brand: {{ gpu.brand.name }}</p>
            <p>VRAM: {{ gpu.vram }} GB</p>
            <p>Price: ${{ gpu.price }}</p>
            <p>Power Consumption: {{ gpu.power_usage }} W</p>
        </div>
    {% endfor %}
</body>
</html>
