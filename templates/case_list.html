<!DOCTYPE html>
<html>

<head>
    <title>All GPUs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="components_page">

<nav class="top_nav_bar">
    <h1 class="logo">PCforce</h1>
    <a href="/">Home</a>
    <a href="/learn">Learn</a>
    <a href="/components">Components</a>
</nav>

<h1 class="page_title">All Graphics Cards</h1>

<section class="component_section">

    <div class="component_grid">

        {% for case in cases %}

        <div class="component_card">

            <div class="image">
                <img src="{{ url_for('static', filename=case.image) }}" alt="{{ case.model }}">
            </div>

            <div class="card_info">

                <p>{{ case.brand.name }}</p>

                <h2>{{ case.model }}</h2>

                <p>Form Factor: {{ case.form_factor }}</p>

                <p>${{ case.price }}</p>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

</body>
</html>
