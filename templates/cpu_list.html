<!DOCTYPE html>
<html>

<head>
    <title>All GPUs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="components_page">

<nav class="top_nav_bar">
    <h1 class="logo">PCforce</h1>
    <a href="/">Home</a>
    <a href="/learn">Learn</a>
    <a href="/components">Components</a>
</nav>

<h1 class="page_title">All Processors</h1>

<section class="component_section">

    <div class="component_grid">

        {% for cpu in cpus %}

        <div class="component_card">

            <div class="image">
                <img src="{{ url_for('static', filename=cpu.image) }}" alt="{{ cpu.model }}">
            </div>

            <div class="card_info">

                <p>{{ cpu.brand.name }}</p>

                <h2>{{ cpu.model }}</h2>

                <p>Cores: {{ cpu.cores }}</p>

                <p>${{ cpu.price }}</p>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

</body>
</html>
