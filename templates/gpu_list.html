<!DOCTYPE html>
<html>

<head>
    <title>All GPUs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="components_page">

<nav class="top_nav_bar">
    <h1 class="logo">PCforce</h1>
    <a href="/">Home</a>
    <a href="/learn">Learn</a>
    <a href="/components">Components</a>
</nav>

<h1 class="page_title">All Graphics Cards</h1>

<form class="catalog_filters" method="get">
    <input
        type="search"
        name="q"
        placeholder="brand or model search"
        value="{{ q }}"
    >

    <select name="brand">
        <option value="">All brands</option>

        {% for brand in brands %}
            <option
                value="{{ brand.brand_id }}"
                {% if filters.brand == brand.brand_id  %}selected{% endif %}
            >{{ brand.name }}</option>
        {% endfor %}

    </select>

    <input
        type="number"
        name="min_price"
        min="0"
        placeholder="min price"
        value="{{ filters.min_price }}"
    >

    <input
        type="number"
        name="max_price"
        min="0"
        placeholder="Max price"
        value="{{ filters.max_price }}"
    >

    <select name="min_vram">
        <option value="">Any Vram</option>
        <option value="8">8</option>
        <option value="12">12</option>
        <option value="16">16</option>
        <option value="24">24</option>
        <option value="32">32</option>
    </select>

    <select name="sort">
        <option value="name">Name A–Z</option>
        <option value="price_low">Price: low to high</option>
        <option value="price_high">Price: high to low</option>
        <option value="vram_high">Highest VRAM </option>
        <option value="performance_high">Best Performance</option>        
    </select>

    <button type="submit">Apply filters</button>
    <a class="clear_filters" href="/gpu">Clear</a>
        <main class="catalog_layout">
            <aside class="catalog_sidebar">
                <form class="catalog_filters" method="get">
                </form>
            

            <section class="catalog_results">
                <p class="catalog_result_count">
                    {{ gpus|length }} graphics cards found
                </p>

                <div class="component_grid">
                    {% for gpu in gpus %}
                    {% endfor %}
                </div>
            </section>
        </main>
    </form>
    </aside>

<section class="component_section">

    <div class="component_grid">

        {% for gpu in gpus %}

        <button
            type="button"
            class="component_card"
            data-model="{{ gpu.model }}"
            data-image="{{ url_for('static', filename=gpu.image) }}"
            data-details='{{ {
                "Brand": gpu.brand.name,
                "Price": "$" ~ gpu.price,
                "VRAM": gpu.vram ~ " GB"
            } | tojson }}'
         >
            <div class="image">
                <img src="{{ url_for('static', filename=gpu.image) }}"
                    alt="{{ gpu.model }}">
            </div>

            <div class="card_info">
                <p>{{ gpu.brand.name }}</p>
                <h2>{{ gpu.model }}</h2>
                <p>VRAM: {{ gpu.vram }} GB</p>
                <p>${{ gpu.price }}</p>
            </div>
        </button>

        {% endfor %}

    </div>

</section>

<div class="details_modal" id="detailsModal">
    <div class="modal_box">
        <button type="button" class="modal_close" id="modalClose">&times;</button>

        <img id="modalImage" class="modal_image" alt="">
        <p id="modalBrand" class="modal_brand"></p>
        <h1 id="modalTitle"></h1>
        <div id="modalDetails"></div>
    </div>
</div>

<script>
            const modal = document.getElementById("detailsModal");
            const closeButton = document.getElementById("modalClose");
            const modalImage = document.getElementById("modalImage");
            const modalBrand = document.getElementById("modalBrand");
            const modalTitle = document.getElementById("modalTitle");
            const modalDetails = document.getElementById("modalDetails");

            document.querySelectorAll(".component_card[data-details]").forEach((card) => {
                card.addEventListener("click", () => {
                    const details = JSON.parse(card.dataset.details);

                    modalImage.src = card.dataset.image;
                    modalImage.alt = card.dataset.model;
                    modalTitle.textContent = card.dataset.model;
                    modalBrand.textContent = details.Brand;
                    modalDetails.innerHTML = "";

                    Object.entries(details).forEach(([label, value]) => {
                        if (label === "Brand") return;

                        const detail = document.createElement("p");
                        detail.innerHTML = `<strong>${label}:</strong> ${value}`;
                        modalDetails.appendChild(detail);
                    });

                    modal.classList.add("open");
                    document.body.classList.add("modal_open");
                });
            });

            function closeModal() {
                modal.classList.remove("open");
                document.body.classList.remove("modal_open");
            }

            closeButton.addEventListener("click", closeModal);

            modal.addEventListener("click", (event) => {
                if (event.target === modal) closeModal();
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") closeModal();
            });
        </script>

</body>
</html>
